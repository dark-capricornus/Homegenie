services:
  # MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: homegenie-mqtt
    ports:
      - "1883:1883"
      - "9003:9001" # WebSocket for browser clients
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - homegenie-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # HomeGenie Unified Application
  homegenie:
    build:
      context: .
      dockerfile: Dockerfile.unified
    container_name: homegenie-app
    ports:
      - "8080:8000" # API
      - "3000:3000" # web UI
    env_file:
      - .env
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - LOG_LEVEL=DEBUG
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - POSTGRES_USER=homegenie
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=homegenie_db
      - POSTGRES_HOST=globalone
      - POSTGRES_PORT=5432
      - POSTGRES_URL=postgresql+psycopg://homegenie:changeme@globalone:5432/homegenie_db
      - ENABLE_POSTGRES_MIGRATION=true
      # Security / CORS
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost:49792
      - RATE_LIMIT_RPM=30
      # LLM / Ollama settings (host desktop Ollama topology - change OLLAMA_HOST for Compose topology)
      - LLM_ENABLED=true
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - LLM_TIMEOUT=30
      - PLANNER_TIMEOUT=25
    depends_on:
      mqtt-broker:
        condition: service_started
      globalone:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - homegenie-net
    restart: unless-stopped

  # PostgreSQL Database
  globalone:
    image: postgres:15
    container_name: globalone
    environment:
      - POSTGRES_USER=homegenie
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=homegenie_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - homegenie-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U homegenie -d homegenie_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev mode
  homegenie-dev:
    build:
      context: .
      dockerfile: Dockerfile.unified
    container_name: homegenie-app-dev
    ports:
      - "8081:8000"
    env_file:
      - .env
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - LOG_LEVEL=DEBUG
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - POSTGRES_USER=homegenie
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=homegenie_db
      - POSTGRES_HOST=globalone
      - POSTGRES_PORT=5432
      - POSTGRES_URL=postgresql+psycopg://homegenie:changeme@globalone:5432/homegenie_db
      - ENABLE_POSTGRES_MIGRATION=true
      # Security / CORS
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8081,http://localhost:49792
      - RATE_LIMIT_RPM=60
      # LLM / Ollama settings (host desktop Ollama topology - change OLLAMA_HOST for Compose topology)
      - LLM_ENABLED=true
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - LLM_TIMEOUT=30
      - PLANNER_TIMEOUT=25
    volumes:
      - ./:/app:cached
    depends_on:
      - mqtt-broker
      - globalone
    command: [ "uvicorn", "src.api.api_server:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    networks:
      - homegenie-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: homegenie-ollama
    # Port not exposed on host to avoid conflict with host Ollama.
    # Other compose services reach it via http://ollama:11434 on the docker network.
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - homegenie-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  homegenie-net:
    name: homegenie-net
    driver: bridge

volumes:
  mqtt-data:
  mqtt-logs:
  ollama-data:
