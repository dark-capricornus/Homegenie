name: homegenie_app
description: HomeGenie Smart Home Control App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  cupertino_icons: ^1.0.2
  logging: ^1.2.0
  shared_preferences: ^2.0.15
  mqtt_client: ^9.0.4
  web_socket_channel: ^3.0.0
  record: ^5.0.4
  fl_chart: ^0.70.2
  provider: ^6.1.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
    
dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/google_fonts/Outfit-Regular.ttf
        - asset: assets/google_fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Outfit-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/google_fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/google_fonts/SpaceGrotesk-Bold.ttf
          weight: 700