name: CI Non-Destructive

on:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Ensure feature flags disabled for compatibility tests
      ENABLE_POSTGRES_MIGRATION: 'false'
      ENABLE_REDIS_BRIDGE: 'false'
      ENABLE_ALEXA_BRIDGE: 'false'
      ENABLE_GOOGLE_BRIDGE: 'false'
      ENABLE_WS_BRIDGE: 'false'
      API_HOST: 'localhost'
      API_PORT: '8080'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f config/requirements.txt ]; then pip install -r config/requirements.txt; fi

      - name: Run linters (optional)
        run: |
          echo "Running lint (flake8 if available)"
          if python -c "import flake8" 2>/dev/null; then flake8 || true; fi

      - name: Run pytest (compatibility mode)
        env:
          API_HOST: ${{ env.API_HOST }}
          API_PORT: ${{ env.API_PORT }}
        run: |
          pytest -q || true
