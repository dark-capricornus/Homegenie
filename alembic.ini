[alembic]
script_location = alembic
# the sqlalchemy.url is intentionally left blank here; scripts/migrate.py sets it from POSTGRES_URL
sqlalchemy.url = postgresql+psycopg://homegenie:changeme@globalone:5432/homegenie_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[logger_sqlalchemy]
level = INFO
handlers = console
qualname = sqlalchemy.engine
